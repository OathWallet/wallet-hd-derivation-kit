name: Search indexing

on:
  workflow_run:
    workflows: [Pages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://oathwallet.github.io/wallet-hd-derivation-kit/sitemap.xml)" = 200
          curl -fsS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @- <<'JSON'
          {"host":"oathwallet.github.io","key":"db18e9469117edd033fe2e03d6c08ebe","keyLocation":"https://oathwallet.github.io/wallet-hd-derivation-kit/db18e9469117edd033fe2e03d6c08ebe.txt","urlList":["https://oathwallet.github.io/wallet-hd-derivation-kit/","https://oathwallet.github.io/wallet-hd-derivation-kit/swift/","https://oathwallet.github.io/wallet-hd-derivation-kit/javascript/","https://oathwallet.github.io/wallet-hd-derivation-kit/python/","https://oathwallet.github.io/wallet-hd-derivation-kit/rust/","https://oathwallet.github.io/wallet-hd-derivation-kit/go/","https://oathwallet.github.io/wallet-hd-derivation-kit/dart/","https://oathwallet.github.io/wallet-hd-derivation-kit/kotlin/","https://oathwallet.github.io/wallet-hd-derivation-kit/cli/","https://oathwallet.github.io/wallet-hd-derivation-kit/security/","https://oathwallet.github.io/wallet-hd-derivation-kit/benchmarks/","https://oathwallet.github.io/wallet-hd-derivation-kit/comparisons/"]}
          JSON
